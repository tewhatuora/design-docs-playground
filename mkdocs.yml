site_name: Health New Zealand Standards Template # <- EDIT
site_url: https://documentation.example.com/ # <- EDIT
copyright: Copyright &copy; 2026 Health New Zealand.
extra:
  generator: false
exclude_docs: |
  **/AGENTS.md
plugins:
  - include-markdown
  - meta
  - privacy:
      assets_exclude:
        # Material loads Mermaid from this URL at runtime. The privacy plugin
        # rewrites it to site_url + the original URL, which 404s, so diagrams
        # render as raw code. Leave it alone.
        - unpkg.com/mermaid@11/*
  - search
  - glightbox:
      width: 90%
      height: auto
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
  logo: assets/two.svg
  favicon: assets/favicon-32x32.png
  font:
    code: Poppins
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: theme-overrides
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mermaid-glightbox.js
  - assets/javascripts/section-disclosures.js
markdown_extensions:
  - toc:
      toc_depth: "1-2"   # include H1 and H2 only, hide H3+
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
# Uncomment and edit `nav` section below to switch from autogenerated navigation
# to a hardcoded one with custom titles and item order.
